# Officer Can secure store — EXAMPLE ONLY, placeholder values.
#
# Real file: config/secrets.yaml.age, written by skills/vendor-forms/scripts/formfill.py (remember-fact, store-doc, import).
# You don't edit it by hand, and the plaintext never exists in the repo. This example shows its shape.
# The age key lives at ~/.config/officer-can/age.key (mode 600) and in your password manager.
#
# Only the form filler decrypts, at fill time. Every model sees key NAMES, never values.
#
# release:
#   auto     fill without asking
#   approve  hold the draft until the owner approves this specific form
#   never    never filled or attached, even if a form asks

values:
  ein:                      { value: "00-0000000",      release: auto }
  state_sales_tax_id:       { value: "00000000000",     release: auto }
  state_unemployment_tax_id: { value: "00-000000-0",     release: approve }
  duns:                     { value: "",                release: auto }
  bank_name:                { value: "Example Bank",    release: approve }
  bank_account_number:      { value: "000000000",       release: approve }
  bank_routing_number:      { value: "000000000",       release: approve }
  owner_date_of_birth:      { value: "1990-01-01",      release: approve }
  owner_ssn:                { value: "",                release: never }
  signature_image:          { value: "",                release: never }

documents:
  w9:                  { file: "docs/W9.pdf.age",                 release: auto }
  ein_letter:          { file: "docs/EIN-letter.pdf.age",         release: auto }
  incorporation:       { file: "docs/Incorporation.pdf.age",      release: auto }
  resale_certificate:  { file: "docs/Resale-certificate.pdf.age", release: auto }
  certificate_of_insurance: { file: "docs/COI.pdf.age",           release: approve }
  bank_letter:         { file: "docs/Bank-letter.pdf.age",        release: approve }
  financial_statements: { file: "",                                release: never }

audit:
  log_every_release: true      # time, form, recipient, key name — never the value
